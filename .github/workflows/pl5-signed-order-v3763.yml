name: PL5 V3.7.63 signed execution order audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-signed-order-v3763.yml"
      - "docs/research/experiments/signed_order_v3763.py"
      - "docs/research/SIGNED_ORDER_V3763.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-order:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing research dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Verify exact weighted signed conjunction order and independent oracles
        run: python docs/research/experiments/signed_order_v3763.py
