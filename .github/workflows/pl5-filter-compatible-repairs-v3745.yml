name: PL5 V3.7.45 minimum-compatible-filter relaxation

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-filter-compatible-repairs-v3745.yml"
      - "pl5-cumulative/research_backend/pailie5/filter_compatible_repairs_v3745.py"
      - "pl5-cumulative/research_backend/tests/test_filter_compatible_repairs_v3745.py"
      - "pl5-cumulative/research_backend/pailie5/filter_conflict_certificates_v3744.py"
      - "pl5-cumulative/research_backend/pailie5/filter_fair_longitudinal_v3743.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-compatible-family-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the existing frozen candidate adapters and pytest
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Complete-lattice and independent set-oracle tests
        run: python -m pytest -q tests/test_filter_compatible_repairs_v3745.py tests/test_filter_conflict_certificates_v3744.py
      - name: Reconstruct strictly past-only synthetic frozen candidates
        run: python -m pailie5.filter_fair_longitudinal_v3743 --output ../../ci-results/v3745-frozen.json
      - name: Compute full-intersection conflict ledger
        run: python -m pailie5.filter_conflict_certificates_v3744 --frozen-input ../../ci-results/v3745-frozen.json --output ../../ci-results/v3745-conflicts.json
      - name: Prove exact minimum rule relaxations with independent oracle
        run: python -m pailie5.filter_compatible_repairs_v3745 --frozen-input ../../ci-results/v3745-frozen.json --conflict-input ../../ci-results/v3745-conflicts.json --output ../../ci-results/v3745-repairs.json
      - name: Preserve complete finite-lattice input and certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-v3745-repairs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ci-results/v3745-frozen.json
            ci-results/v3745-conflicts.json
            ci-results/v3745-repairs.json
          retention-days: 30
          if-no-files-found: warn
