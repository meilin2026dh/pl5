name: PL5 V3.7.57 cap-feasible union audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-cap-union-v3757.yml"
      - "docs/research/experiments/k100_union_audit_v3757.py"
      - "docs/research/K100_UNION_AUDIT_V3757.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-union:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing project numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Independently verify union-of-feasible-sets and reference
        run: python docs/research/experiments/k100_union_audit_v3757.py
