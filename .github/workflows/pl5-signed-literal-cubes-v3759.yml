name: PL5 V3.7.59 signed-literal Boolean cube audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-signed-literal-cubes-v3759.yml"
      - "docs/research/experiments/signed_literal_cubes_v3759.py"
      - "docs/research/SIGNED_LITERAL_CUBES_V3759.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-cube:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing offline research dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Verify exact signed-rule atoms and independent signature oracle
        run: python docs/research/experiments/signed_literal_cubes_v3759.py
