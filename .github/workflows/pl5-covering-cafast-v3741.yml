name: PL5 covering array cafast/caverify independent benchmark

on:
  pull_request:
    paths:
      - "pl5-cumulative/research_backend/pailie5/cafast_covering_bridge_v3741.py"
      - "pl5-cumulative/research_backend/tests/test_cafast_covering_bridge_v3741.py"
      - "ci/cafast_verify_v3741.R"
      - ".github/workflows/pl5-covering-cafast-v3741.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test old covering arrays and new t4/pruning bridge
        working-directory: pl5-cumulative/research_backend
        shell: bash
        run: |
          python -m pip install "pytest>=8,<10" "numpy>=1.26,<3"
          python -m pytest -q tests/test_covering_arrays_v3713.py tests/test_cafast_covering_bridge_v3741.py
      - name: Build immutable CSV and JSON covering witnesses
        working-directory: pl5-cumulative/research_backend
        run: python -m pailie5.cafast_covering_bridge_v3741 --outdir ../../ci-results/covering-v3741
      - name: Preserve full tuple coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covering-python-${{ matrix.os }}-${{ github.run_id }}
          path: ci-results/covering-v3741/
          retention-days: 30
          if-no-files-found: warn

  actual-cran-cafast:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Generate PL5 arrays with frozen Python reference source
        working-directory: pl5-cumulative/research_backend
        run: python -m pailie5.cafast_covering_bridge_v3741 --outdir ../../ci-results/covering-v3741
      - name: Install actual CRAN cafast and caverify packages
        shell: bash
        run: |
          Rscript -e 'install.packages(c("cafast", "caverify"), repos="https://cloud.r-project.org")'
          Rscript -e 'stopifnot(packageVersion("cafast") >= "0.1.1"); cat("cafast", as.character(packageVersion("cafast")), "\n")'
      - name: Independently check all t=2,3,4 arrays with cafast and caverify
        shell: bash
        run: Rscript ci/cafast_verify_v3741.R ci-results/covering-v3741
      - name: Upload R verified coverage certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covering-cran-cafast-${{ github.run_id }}
          path: ci-results/covering-v3741/
          retention-days: 30
          if-no-files-found: warn
