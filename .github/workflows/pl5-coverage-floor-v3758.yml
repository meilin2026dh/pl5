name: PL5 V3.7.58 fixed coverage floor audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-coverage-floor-v3758.yml"
      - "docs/research/experiments/coverage_floor_v3758.py"
      - "docs/research/COVERAGE_FLOOR_V3758.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-coverage-floor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing offline numeric dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Prove minimum K via independent exhaustive 1024-subset oracle
        run: python docs/research/experiments/coverage_floor_v3758.py
