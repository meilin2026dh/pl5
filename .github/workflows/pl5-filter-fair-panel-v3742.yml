name: PL5 V3.7.42 frozen fair-filter experiment ledger

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-filter-fair-panel-v3742.yml"
      - "pl5-cumulative/research_backend/pailie5/filter_fair_ledger_v3742.py"
      - "pl5-cumulative/research_backend/pailie5/filter_fair_cli_v3742.py"
      - "pl5-cumulative/research_backend/tests/test_filter_fair_ledger_v3742.py"
      - "ci/filter_fair_fixture_v3742.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal scientific dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Verify frozen panel contracts and legacy-module integration
        run: python -m pytest -q tests/test_filter_fair_ledger_v3742.py

  freeze-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing numeric dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2"
      - name: Extract only 41 historical synthetic training rows
        run: |
          python ci/filter_fair_fixture_v3742.py --mode training --input pl5-cumulative/research_backend/data/synthetic_demo.csv --output ci-results/filter-v3742/training-only.csv
      - name: Freeze three real prior-engine K=100 filter output bitmaps
        working-directory: pl5-cumulative/research_backend
        run: |
          python -m pailie5.filter_fair_cli_v3742 freeze --training-csv ../../ci-results/filter-v3742/training-only.csv --evaluation-issue 000042 --output ../../ci-results/filter-v3742/frozen.json
      - name: Upload frozen panel BEFORE dependent evaluation job
        uses: actions/upload-artifact@v4
        with:
          name: v3742-frozen-panel-${{ github.run_id }}
          path: ci-results/filter-v3742/frozen.json
          retention-days: 30

  evaluate-later:
    needs: [freeze-first, cross-platform-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: v3742-frozen-panel-${{ github.run_id }}
          path: ci-results/filter-v3742
      - name: Prepare reserved one-row synthetic observation
        run: |
          python ci/filter_fair_fixture_v3742.py --mode observation --input pl5-cumulative/research_backend/data/synthetic_demo.csv --output ci-results/filter-v3742/observation-only.csv
      - name: Validate original candidate hashes and evaluate unchanged frozen panel
        working-directory: pl5-cumulative/research_backend
        run: |
          python -m pailie5.filter_fair_cli_v3742 evaluate --frozen ../../ci-results/filter-v3742/frozen.json --observation-csv ../../ci-results/filter-v3742/observation-only.csv --output ../../ci-results/filter-v3742/evaluation.json
      - name: Export frozen and evaluation JSON as separately inspectable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v3742-sealed-filter-evaluation-${{ github.run_id }}
          path: |
            ci-results/filter-v3742/frozen.json
            ci-results/filter-v3742/evaluation.json
          retention-days: 30
