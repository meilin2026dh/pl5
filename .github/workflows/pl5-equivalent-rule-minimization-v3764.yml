name: PL5 V3.7.64 equivalent signed-filter minimization
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-equivalent-rule-minimization-v3764.yml"
      - "docs/research/experiments/equivalent_rule_minimization_v3764.py"
      - "docs/research/EQUIVALENT_RULE_MINIMIZATION_V3764.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - run: python docs/research/experiments/equivalent_rule_minimization_v3764.py
