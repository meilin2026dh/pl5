name: PL5 V3.7.43 longitudinal fair-filter ledger

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-filter-longitudinal-v3743.yml"
      - "pl5-cumulative/research_backend/pailie5/filter_fair_longitudinal_v3743.py"
      - "pl5-cumulative/research_backend/pailie5/filter_fair_ledger_v3742.py"
      - "pl5-cumulative/research_backend/tests/test_filter_fair_longitudinal_v3743.py"
      - "pl5-cumulative/research_backend/pailie5/legacy_method_census_v3740.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific and test dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Check longitudinal chained record and legacy fair panel invariants
        run: python -m pytest -q tests/test_filter_fair_longitudinal_v3743.py tests/test_filter_fair_ledger_v3742.py
      - name: Run complete fixed 24-window six-method synthetic study
        run: python -m pailie5.filter_fair_longitudinal_v3743 --output ../../ci-results/v3743-24windows-${{ matrix.os }}.json
      - name: Preserve full candidate IDs and summary proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-v3743-longitudinal-${{ matrix.os }}-${{ github.run_id }}
          path: ci-results/v3743-24windows-${{ matrix.os }}.json
          retention-days: 30
          if-no-files-found: warn
