name: PL5 V3.7.40 complete method census and filter matrix

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-legacy-allmethods-v3740.yml"
      - "pl5-cumulative/research_backend/pailie5/legacy_method_census_v3740.py"
      - "pl5-cumulative/research_backend/pailie5/legacy_filter_matrix_v3740.py"
      - "pl5-cumulative/research_backend/tests/test_legacy_filter_matrix_v3740.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auditable scientific dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Unit tests and past-only synthetic evidence
        run: python -m pytest -q tests/test_legacy_filter_matrix_v3740.py
      - name: Preserve complete method census, per-rule effects and frozen-combination ledger
        run: python -m pailie5.legacy_filter_matrix_v3740 --output ../../ci-results/v3740-allmethods-${{ matrix.os }}.json
      - name: Upload immutable evidence snapshot (no private records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-v3740-allmethods-${{ matrix.os }}-${{ github.run_id }}
          path: ci-results/v3740-allmethods-${{ matrix.os }}.json
          retention-days: 30
          if-no-files-found: warn
