name: PL5 V3.7.34 exact static-filter interaction audit

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-filter-interactions-v3734.yml"
      - "pl5-cumulative/research_backend/pailie5/filter_interactions_v3734.py"
      - "pl5-cumulative/research_backend/tests/test_filter_interactions_v3734.py"
      - "pl5-cumulative/research_backend/pailie5/ga_cs_optimizer_v3715.py"
      - "pl5-cumulative/research_backend/pailie5/constraint_portfolio_v3731.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-exact-interactions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pytest>=8,<10"
      - name: Verify exact static-filter overlap and permutation proofs
        run: python -m pytest -q tests/test_filter_interactions_v3734.py tests/test_constraint_portfolio_v3731.py
