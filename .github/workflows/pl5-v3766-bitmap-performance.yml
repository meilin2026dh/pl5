name: PL5 V3.7.66 bitmap performance audit
on:
  pull_request:
    paths:
      - 'docs/research/experiments/bitmap_performance_v3766.py'
      - 'docs/research/experiments/bitmap_output_cost_v3767.py'
      - 'docs/research/experiments/partial_cache_v3768.py'
      - 'docs/research/experiments/adaptive_cache_v3769.py'
      - 'docs/research/experiments/byte_prefix_cache_v3770.py'
      - 'docs/research/experiments/minimal_conflict_v3771.py'
      - 'docs/research/experiments/conflict_pruning_v3772.py'
      - 'docs/research/experiments/static_entropy_v3773.py'
      - 'docs/research/experiments/entropy_search_v3774.py'
      - 'docs/research/experiments/static_pareto_v3775.py'
      - 'docs/research/experiments/projection_cost_v3776.py'
      - 'docs/research/experiments/robust_projection_v3777.py'
      - 'docs/research/experiments/projection_work_v3778.py'
      - 'docs/research/experiments/projection_tree_v3779.py'
      - 'docs/research/experiments/shared_entropy_v3780.py'
      - 'docs/research/experiments/cached_shapley_v3781.py'
      - 'docs/research/experiments/static_exclusion_v3782.py'
      - 'docs/research/experiments/boolean_rank_v3801.py'
      - 'docs/research/experiments/linear_quotient_v3802.py'
      - 'docs/research/experiments/partition_equivalence_v3803.py'
      - 'docs/research/experiments/graph_refinement_v3804.py'
      - 'docs/research/experiments/conditional_graph_v3805.py'
      - 'docs/research/experiments/reciprocal_redundancy_v3806.py'
      - 'docs/research/experiments/local_return_refinement_v3807.py'
      - '.github/workflows/pl5-v3766-bitmap-performance.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'research/audit-bitmap-performance-v3766'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - run: python docs/research/experiments/bitmap_performance_v3766.py

      - run: python docs/research/experiments/bitmap_output_cost_v3767.py
      - run: python docs/research/experiments/partial_cache_v3768.py
      - run: python docs/research/experiments/adaptive_cache_v3769.py
      - run: python docs/research/experiments/byte_prefix_cache_v3770.py
      - run: python docs/research/experiments/minimal_conflict_v3771.py

      - run: python docs/research/experiments/conflict_pruning_v3772.py

      - run: python docs/research/experiments/static_entropy_v3773.py

      - run: python docs/research/experiments/entropy_search_v3774.py

      - run: python docs/research/experiments/static_pareto_v3775.py

      - run: python docs/research/experiments/projection_cost_v3776.py

      - run: python docs/research/experiments/robust_projection_v3777.py

      - run: python docs/research/experiments/projection_work_v3778.py

      - run: python docs/research/experiments/projection_tree_v3779.py

      - run: python docs/research/experiments/shared_entropy_v3780.py

      - run: python docs/research/experiments/cached_shapley_v3781.py

      - run: python docs/research/experiments/static_exclusion_v3782.py

      - run: python docs/research/experiments/boolean_rank_v3801.py

      - run: python docs/research/experiments/linear_quotient_v3802.py

      - run: python docs/research/experiments/partition_equivalence_v3803.py

      - run: python docs/research/experiments/graph_refinement_v3804.py

      - run: python docs/research/experiments/conditional_graph_v3805.py

      - run: python docs/research/experiments/reciprocal_redundancy_v3806.py

      - run: python docs/research/experiments/local_return_refinement_v3807.py
