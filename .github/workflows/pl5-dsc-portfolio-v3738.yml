name: PL5 V3.7.38 DSC incremental filter portfolio audit

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-dsc-portfolio-v3738.yml"
      - "pl5-cumulative/research_backend/pailie5/dsc_portfolio_audit_v3738.py"
      - "pl5-cumulative/research_backend/tests/test_dsc_portfolio_audit_v3738.py"
      - "pl5-cumulative/research_backend/pailie5/digit_structure_v3737.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-audit dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pytest>=8,<10"
      - name: Verify full-domain DSC portfolio and independent oracles
        run: python -m pytest -q tests/test_dsc_portfolio_audit_v3738.py tests/test_digit_structure_v3737.py tests/test_filter_interactions_v3734.py tests/test_filter_equivalent_pruning_v3735.py
