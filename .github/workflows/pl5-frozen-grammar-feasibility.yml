name: PL5 V3.7.29 frozen grammar CRT feasibility
on:
  push:
    branches: [research/v3729-independent-blind-prep]
    paths:
      - "pl5-cumulative/research_backend/research_frozen_grammar_rank_v3729.py"
      - "pl5-cumulative/research_backend/tests/test_frozen_grammar_rank_v3729.py"
      - ".github/workflows/pl5-frozen-grammar-feasibility.yml"
  pull_request:
    paths:
      - "pl5-cumulative/research_backend/research_frozen_grammar_rank_v3729.py"
      - "pl5-cumulative/research_backend/tests/test_frozen_grammar_rank_v3729.py"
      - ".github/workflows/pl5-frozen-grammar-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-rank-oracle:
    name: CRT feasibility / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen scientific environment
        working-directory: pl5-cumulative/research_backend
        run: python -m pip install -e . "pytest>=8,<10"
      - name: Compile rank oracle and synthetic tests
        run: python -m compileall -q pl5-cumulative/research_backend/research_frozen_grammar_rank_v3729.py pl5-cumulative/research_backend/tests/test_frozen_grammar_rank_v3729.py
      - name: Independent modular rank agreement against frozen fit algorithms
        working-directory: pl5-cumulative/research_backend
        run: python -m pytest -q tests/test_frozen_grammar_rank_v3729.py
