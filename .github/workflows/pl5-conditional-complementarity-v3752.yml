name: PL5 V3.7.52 conditional complementarity
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-conditional-complementarity-v3752.yml"
      - "docs/research/experiments/conditional_complementarity_v3752.py"
      - "docs/research/CONDITIONAL_COMPLEMENTARITY_V3752.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - run: python docs/research/experiments/conditional_complementarity_v3752.py
