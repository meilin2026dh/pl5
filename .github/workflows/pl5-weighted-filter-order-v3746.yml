name: PL5 V3.7.46 weighted filter order audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-weighted-filter-order-v3746.yml"
      - "pl5-cumulative/research_backend/pailie5/weighted_filter_order_v3746.py"
      - "pl5-cumulative/research_backend/tests/test_weighted_filter_order_v3746.py"
      - "pl5-cumulative/research_backend/tests/test_filter_runtime_v3747.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weighted-order:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing test dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Verify independent permutation oracle and full-domain sensitivity
        run: python -m pytest -q tests/test_weighted_filter_order_v3746.py
      - name: Record bounded runtime samples and verify identical candidate identities
        run: python -m pytest -q -s tests/test_filter_runtime_v3747.py
