name: PL5 V3.7.53 exact conjunction and conflict audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-number-theory-conjunction-v3753.yml"
      - "docs/research/experiments/number_theory_conjunction_v3753.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Verify and save exact lattice
        run: python docs/research/experiments/number_theory_conjunction_v3753.py > conjunction-results.txt
      - name: Emit compact evidence
        run: python -c "import json; r=json.loads(open('conjunction-results.txt',encoding='utf-8-sig').read().split('V3753_CONJUNCTION_JSON=',1)[1]); keys=('baseline_count','all_rules_retained','empty_subsets','distinct_output_bitmaps','minimal_empty_subsets','maximal_nonempty_subsets','minimum_added_rules_for_cap','cap_feasible_subsets','frontier'); print('V3753_SUMMARY='+json.dumps({k:{a:v[a] for a in keys} for k,v in r['baselines'].items()},sort_keys=True))"
      - uses: actions/upload-artifact@v4
        with:
          name: conjunction-evidence-${{ matrix.os }}
          path: conjunction-results.txt
