name: PL5 V3.7.55 exact joint operator redundancy
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-joint-operator-redundancy-v3755.yml"
      - "docs/research/experiments/joint_operator_redundancy_v3755.py"
      - "docs/research/JOINT_OPERATOR_REDUNDANCY_V3755.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-operator-proof:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Exact joint redundancy and independent pair oracle
        run: python docs/research/experiments/joint_operator_redundancy_v3755.py
