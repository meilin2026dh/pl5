name: PL5 V3.7.51 number theory independent contribution
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-number-theory-independence-v3751.yml"
      - "docs/research/experiments/number_theory_independence_v3751.py"
      - "docs/research/NUMBER_THEORY_INDEPENDENCE_V3751.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-static-inventory-refinement:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3" "pytest>=8,<10"
      - name: Prove exact 58-mask Boolean signature refinement and witness checks
        run: python docs/research/experiments/number_theory_independence_v3751.py
