name: PL5 V3.7.54 exact spectral independence
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-spectral-independence-v3754.yml"
      - "docs/research/experiments/spectral_independence_v3754.py"
      - "docs/research/SPECTRAL_INDEPENDENCE_V3754.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-spectral-proof:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Independent DFT proof and 58+9 static signatures
        run: python docs/research/experiments/spectral_independence_v3754.py
