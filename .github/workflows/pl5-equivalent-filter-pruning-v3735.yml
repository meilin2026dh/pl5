name: PL5 V3.7.35 equivalent filter pruning checks

on:
  pull_request:
    paths:
      - ".github/workflows/pl5-equivalent-filter-pruning-v3735.yml"
      - "pl5-cumulative/research_backend/pailie5/filter_equivalent_pruning_v3735.py"
      - "pl5-cumulative/research_backend/tests/test_filter_equivalent_pruning_v3735.py"
      - "pl5-cumulative/research_backend/pailie5/constraint_portfolio_v3731.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-pruning:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: pl5-cumulative/research_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pytest>=8,<10"
      - name: Run exact-equivalence tests and overlap regressions
        run: python -m pytest -q tests/test_filter_equivalent_pruning_v3735.py tests/test_filter_interactions_v3734.py tests/test_constraint_portfolio_v3731.py
