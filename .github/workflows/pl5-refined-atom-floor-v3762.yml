name: PL5 V3.7.62 refined atom floor audit
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-refined-atom-floor-v3762.yml"
      - "docs/research/experiments/refined_atom_floor_v3762.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atom-floor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - run: python docs/research/experiments/refined_atom_floor_v3762.py
