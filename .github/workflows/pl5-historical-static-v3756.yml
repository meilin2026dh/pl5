name: PL5 V3.7.56 historical static operator coverage
on:
  pull_request:
    paths:
      - ".github/workflows/pl5-historical-static-v3756.yml"
      - "docs/research/experiments/historical_operator_walkforward_v3756.py"
      - "docs/research/HISTORICAL_STATIC_WALKFORWARD_V3756.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-historical-audit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed research dependencies
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.11,<2" "pandas>=2.1,<3"
      - name: Verify source provenance and run all frozen coalitions
        run: python docs/research/experiments/historical_operator_walkforward_v3756.py --output ci-results/v3756-${{ matrix.os }}.json
      - name: Preserve full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-historical-v3756-${{ matrix.os }}-${{ github.run_id }}
          path: ci-results/v3756-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 30
